<div class="layout"><aside class="intro"><div class="brand">吃了么</div><div class="eyebrow" style="margin-top:60px">A LITTLE AWARENESS, EVERY DAY</div><h1>聊聊今天。<br>拍下这一餐。</h1><p>说说吃了什么，或直接拍张照片。吃了么在日常对话中，慢慢记住你的饮食习惯。</p><div class="tags"><span class="tag">Android · 原生设计</span><span class="tag">本地记录</span><span class="tag">自带 API Key</span></div></aside>
<main class="phone" id="phone"><div class="status"><span>9:41</span><span>••• ▰</span></div><div class="appbody" id="screen"></div><div id="composer"></div><nav class="nav" aria-label="主导航" id="nav"></nav></main>
<aside class="guide"><h3>设计预览 / CHAT FIRST</h3><button data-go="welcome">00　首次填写资料</button><button data-go="assistant">01　聊天首页</button><button data-go="capture">02　拍照与校正</button><button data-go="today">03　今日记录</button><button data-go="trends">04　数据趋势</button><button data-go="settings">05　模型与隐私</button><button id="theme">切换深浅主题</button><div class="swatches"><i style="background:#007d50"></i><i style="background:#ffbd45"></i><i style="background:#a594f5"></i><i style="background:#f2fff7"></i></div><p class="note">v0.8 · 周折线与热量月历<br>所有数值均为演示数据。<br>可切换页面、调整份量并模拟保存。<br>不联网，不保存真实数据。</p></aside></div><div id="toast" role="status" class="toast hide"></div>
<script>
const screen=document.getElementById('screen'), nav=document.getElementById('nav');
let current='welcome',factor=1,saved=false,savedFactor=1,memoryEnabled=true;
const messages=[],memories=new Map();
const escapeHtml=value=>String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const total=()=>1420+(saved?Math.round(520*savedFactor):0);
const icon=id=>`<svg class="icon" aria-hidden="true"><use href="#${id}"/></svg>`;
const food=()=>'<svg role="img" aria-label="餐盘示意图，非真实照片"><use href="#plate"/></svg>';
let profile=null,profileDraft={sex:'',age:'',height:'',weight:''},onboarding=true,helpReturn='welcome',keyFilled=false;
const measurements=[];
function resting(p){if(!p||!['male','female'].includes(p.sex)||p.age<19||p.age>78)return null;return Math.round(10*p.weight+6.25*p.height-5*p.age+(p.sex==='male'?5:-161))}
function validProfile(p){return ['male','female','unspecified'].includes(p.sex)&&Number.isInteger(p.age)&&p.age>=1&&p.age<=120&&Number.isFinite(p.height)&&p.height>=80&&p.height<=250&&Number.isFinite(p.weight)&&p.weight>=15&&p.weight<=350}
const restingLabel=()=>resting(profile)===null?'—':resting(profile).toLocaleString();
const header=(title,sub)=>`<div class="top"><div><div class="date">${sub}</div><h2>${title}</h2></div><div class="header-actions"><button data-help="true" class="help-button" aria-label="帮助与说明"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 4.1 1.9c-1.1.7-1.6 1-1.6 2.1M12 16.5v.1"/></svg></button>${!onboarding&&current!=='settings'?`<button data-go="settings" aria-label="打开设置">${icon('settings')}</button>`:''}</div></div>`;
const profileForm=()=>`<form id="profileForm"><div class="card"><label for="sex">性别 <span class="sub">用于公式计算</span></label><select id="sex" required><option value="">请选择</option>${[['male','男'],['female','女'],['unspecified','不提供']].map(([v,t])=>`<option value="${v}" ${profileDraft.sex===v?'selected':''}>${t}</option>`).join('')}</select><div class="profile-grid">${[['age','年龄','岁',1,120,1],['height','身高','cm',80,250,.1],['weight','体重','kg',15,350,.1]].map(([id,label,unit,min,max,step])=>`<div><label for="${id}">${label} <span class="sub">${unit}</span></label><input id="${id}" type="number" inputmode="decimal" min="${min}" max="${max}" step="${step}" required value="${escapeHtml(profileDraft[id])}" placeholder="${id==='age'?'如 28':id==='height'?'如 170':'如 65'}"></div>`).join('')}</div><div class="resting-preview"><small>静息消耗 · 估算</small><div><strong id="restingValue">${validProfile({sex:profileDraft.sex,age:Number(profileDraft.age),height:Number(profileDraft.height),weight:Number(profileDraft.weight)})?(resting({sex:profileDraft.sex,age:Number(profileDraft.age),height:Number(profileDraft.height),weight:Number(profileDraft.weight)})?.toLocaleString()??'—'):'—'}</strong> <span>kcal / 天</span></div></div><p id="profileError" role="alert" class="sub"></p></div><button type="submit" class="primary wide">${onboarding?'下一步 · 连接 AI':'保存身体数据'}</button></form>`;
const modelForm=()=>`<form id="modelForm"><div class="card"><label for="provider">模型服务商</label><select id="provider"><option>DeepSeek</option><option>其他兼容服务（后续接入）</option></select><label for="setupKey">API Key</label><input id="setupKey" type="password" autocomplete="off" maxlength="256" placeholder="sk-…"><p class="sub">交互演示，请勿填写真实 Key。</p><div class="row editrow"><span>连接状态</span><span class="label">未测试</span></div></div><button class="primary wide" type="submit">${onboarding?'完成设置':'保存配置'}</button><button type="button" id="skipKey" class="outline wide">${onboarding?'稍后填写，先开始记录':'返回设置'}</button>${onboarding?'<button type="button" class="outline wide" data-go="welcome">返回身体资料</button>':''}</form>`;
const meal=(name,time,kcal)=>`<div class="card meal"><div class="food">${food()}</div><div class="copy"><strong>${name}</strong><small>${time} · AI 估算 · 已校正</small></div><b>${kcal}<small>kcal</small></b></div>`;
let trendPeriod='week',trendSelection=null,monthOffset=0,weekOffset=0,selectedDate='2026-09-24';
const monthValues=[1760,1820,1690,1740,1880,1610,1700,1790,1680,1850,1720,1600,1810,1760,1690,1830,1710,1800,1650,1720,1500,1740,1671,1420];
const dailyValues=Object.fromEntries(monthValues.map((v,i)=>[`2026-09-${String(i+1).padStart(2,'0')}`,v]));
const isoDate=d=>d.toISOString().slice(0,10);
const periodTabs=()=>`<div class="period-tabs" role="group" aria-label="统计周期">${[['week','周折线'],['month','月历']].map(([id,label])=>`<button data-period="${id}" aria-pressed="${trendPeriod===id}" class="${trendPeriod===id?'selected':''}">${label}</button>`).join('')}</div>`;
function dayDetail(){const value=dailyValues[selectedDate];return `<div class="card day-detail" aria-live="polite"><small>${selectedDate.replaceAll('-',' / ')}</small><h3>${value===undefined?'这一天还没有记录':`${value.toLocaleString()} <small>kcal</small>`}</h3><p class="sub">${value===undefined?'有记录后，热量会显示在对应日期。':'当天摄入 · 示例数据'}</p></div>`}
function calendarPage(){
 const month=new Date(Date.UTC(2026,8+monthOffset,1)),year=month.getUTCFullYear(),m=month.getUTCMonth(),days=new Date(Date.UTC(year,m+1,0)).getUTCDate(),offset=(month.getUTCDay()+6)%7;
 const cells=Array.from({length:Math.ceil((days+offset)/7)*7},(_,i)=>{const day=i-offset+1;if(day<1||day>days)return '<span class="calendar-blank"></span>';const date=isoDate(new Date(Date.UTC(year,m,day))),value=dailyValues[date];return `<button class="calendar-cell ${selectedDate===date?'selected':''} ${value!==undefined?'recorded':''}" data-day="${date}" ${date>'2026-09-24'?'disabled':''} aria-label="${date}，${value===undefined?'未记录':`${value} 千卡`}" aria-pressed="${selectedDate===date}"><span>${day}</span><b>${value??'—'}</b></button>`}).join('');
 return `<div class="card calendar-card"><div class="calendar-header"><button data-month-step="-1" aria-label="上个月">${icon('arrow')}</button><h3>${year} 年 ${m+1} 月</h3><button data-month-step="1" aria-label="下个月" ${monthOffset>=0?'disabled':''}>${icon('arrow')}</button></div><div class="week-labels">${['一','二','三','四','五','六','日'].map(x=>`<span>${x}</span>`).join('')}</div><div class="month-grid" aria-label="左右滑动切换月份">${cells}</div><div class="calendar-caption"><span>每日摄入 · kcal</span><span>左右滑动翻月</span></div></div>`;
}
function weekPage(){
 const from=new Date(Date.UTC(2026,8,21+weekOffset*7)),dates=Array.from({length:7},(_,i)=>isoDate(new Date(from.getTime()+i*86400000))),values=dates.map(d=>dailyValues[d]),known=values.filter(v=>v!==undefined),max=Math.max(2200,...known),avg=known.length?Math.round(known.reduce((a,b)=>a+b,0)/known.length):null;
 let path='',connected=false;const dots=values.map((v,i)=>{if(v===undefined){connected=false;return ''}const x=18+i*44,y=126-v/max*100;path+=`${connected?'L':'M'}${x} ${y} `;connected=true;return `<circle cx="${x}" cy="${y}" r="4"/>`}).join('');
 return `<div class="card week-line-card"><div class="calendar-header"><button data-week-step="-1" aria-label="上一周">${icon('arrow')}</button><h3>${dates[0].slice(5).replace('-','/')} — ${dates[6].slice(5).replace('-','/')}</h3><button data-week-step="1" aria-label="下一周" ${weekOffset>=0?'disabled':''}>${icon('arrow')}</button></div><div class="week-average"><b>${avg?.toLocaleString()??'—'}</b><span>kcal / 已记录日均</span></div><small>0–${max} kcal · ${known.length} 天记录</small><svg class="week-line" viewBox="0 0 300 145" role="img" aria-label="周摄入折线，${values.map((v,i)=>`周${['一','二','三','四','五','六','日'][i]} ${v??'未记录'}`).join('，')}"><path d="M18 26H282M18 76H282M18 126H282" class="line-grid"/><path d="${path}" class="line-data"/><g class="line-dots">${dots}</g></svg><div class="week-days">${dates.map((date,i)=>`<button data-day="${date}" aria-label="${date}，${values[i]??'未记录'}" class="${date===selectedDate?'selected':''}"><span>${['一','二','三','四','五','六','日'][i]}</span><small>${values[i]??'—'}</small></button>`).join('')}</div></div>`;
}
function longTrends(){return header('日常的变化','饮食记录 · 示例')+periodTabs()+(trendPeriod==='month'?calendarPage():weekPage())+dayDetail()}

const pages={
welcome:()=>header('认识一下你','开始使用 · 1 / 2')+`<p class="setup-lead">从你的身体数据开始。</p>${profileForm()}`,
profile:()=>header('身体数据','我的资料')+profileForm()+`<button class="outline wide" data-go="data">查看身体记录</button>`,
setupAI:()=>header('连接你的 AI',onboarding?'开始使用 · 2 / 2':'模型配置')+modelForm(),
data:()=>header('数据记录','保存在此设备')+`<div class="card"><div class="row"><h3>身体记录</h3><button data-edit-profile="true">更新</button></div>${measurements.length?measurements.slice().reverse().map(p=>`<div class="editrow"><div class="row"><strong>${p.weight} kg</strong><span>${p.height} cm</span></div><small>${p.date} · ${p.age} 岁 · 静息估算 ${resting(p)??'—'} kcal / 天</small></div>`).join(''):'<p class="sub">暂无记录</p>'}</div><button class="setting-link" data-go="today">饮食记录 <span>查看 ↗</span></button><button class="setting-link" data-go="trends">趋势与消耗 <span>查看 ↗</span></button><button class="outline wide" data-go="settings">返回设置</button>`,
help:()=>header('帮助与说明','使用指南')+`<div class="card info-card"><div class="info-art">${icon('person')}<span>＋</span>${icon('trend')}</div><h3>身体资料 → 静息估算</h3><p>身高、体重、年龄，共同构成每日估值。</p><details><summary>计算方式与适用范围</summary><p>Mifflin–St Jeor：10 × 体重(kg) + 6.25 × 身高(cm) − 5 × 年龄；男性加 5，女性减 161。</p><p>仅对 19–78 岁且选择公式性别参数的资料显示估算，否则显示「—」。估算不是测量结果，也不是饮食目标；孕哺等特殊情况不使用自动饮食目标。</p><a href="https://pubmed.ncbi.nlm.nih.gov/2305711/" target="_blank" rel="noopener noreferrer">原始研究 ↗</a></details></div><div class="card info-card"><div class="info-art">${icon('camera')}${icon('arrow')}${icon('settings')}${icon('arrow')}${icon('home')}</div><h3>拍下 · 校正 · 记下</h3><p>份量、用油和酱汁，在确认前校正。</p></div><div class="card info-card"><div class="info-art">${icon('device')}${icon('arrow')}${icon('chat')}</div><h3>记录在本机，AI 按需连接</h3><p>调用 AI 时，所选照片或上下文会发给你配置的服务商。</p><details><summary>数据与密钥</summary><p>正式版在本机保存记录，Key 使用系统密钥保护。视觉能力需单独验证，未填 Key 也可本地记录。</p></details></div><div class="card info-card"><div class="info-art">${icon('chat')}${icon('arrow')}${icon('leaf')}</div><h3>每一次记录，多了解你一点</h3><p>明确偏好与已确认餐次，自动更新本地记忆。</p><details><summary>管理记忆</summary><p>设置中可关闭、查看和忘记；不会把 AI 猜测当作个人事实。</p></details></div><div class="card info-card"><h3>这是交互设计稿</h3><p>数据刷新后重置，无真实拍照或模型请求。Key 离开后丢弃，不保存、不发送；饮食与趋势均为示例。</p></div><button id="backHelp" class="primary wide" aria-label="返回">${icon('arrow')}</button>`,

today:()=>header('今天，照顾好自己','9 月 24 日，星期四 · 本地记录')+`<div class="card hero"><div><div class="sub">今日已摄入</div><div class="number">${saved?1420+Math.round(520*savedFactor):1420} <span class="unit">kcal</span></div><div class="sub" style="margin-top:14px">目标 1,900 kcal</div><div style="font-size:13px">${saved?'已加入新的演示餐次':'距目标还有 480 kcal'}</div></div><div class="ring" aria-label="初始演示目标完成约75%" ${saved?'style="display:none"':''}></div></div><div class="quick-actions" aria-label="快捷记录与对话"><button class="action-card ai-action" data-go="assistant"><span class="action-head"><span class="action-icon">${icon('chat')}</span><span class="action-arrow" aria-hidden="true">↗</span></span><span class="sr-only">和 AI 聊聊</span></button><button class="action-card photo-action" data-go="capture"><span class="action-head"><span class="action-icon">${icon('camera')}</span><span class="action-arrow" aria-hidden="true">↗</span></span><span class="sr-only">拍照记一餐</span></button></div><div class="row mini-heading"><h3>营养与消耗</h3><span class="sub">今日概览</span></div><div class="grid">${[['蛋白质','86','75%','var(--green)'],['碳水','170','66%','var(--apricot)'],['脂肪','44','61%','var(--purple)']].map(x=>`<div class="macro"><small>${x[0]}</small><b>${x[1]}<span class="unit"> g</span></b><div class="track"><i style="width:${x[2]};background:${x[3]}"></i></div></div>`).join('')}</div><div class="grid two"><div class="card metric"><small>静息 · 全天估值</small><b>${restingLabel()} <span class="unit">kcal</span></b><small>身体资料估算</small></div><div class="card metric"><small>活动 · 已记录</small><b>320 <span class="unit">kcal</span></b><small>截至 12:40</small></div></div><div class="row section"><h3>今天吃了什么</h3><span class="sub">${saved?'3':'2'} 条记录</span></div>${meal('鸡肉蔬菜饭','午餐 12:20',680)}${meal('全麦吐司与鸡蛋','早餐 08:10',740)}${saved?meal('新加入的演示餐次','午餐 12:45',Math.round(520*savedFactor)):''}`,
capture:()=>header('确认这一餐','照片识别 / 结果待校正')+`<div class="bigfood">${food()}</div><div class="row" style="margin-bottom:14px"><span class="label">午餐 · 今天 12:45</span><span class="label warm">AI 估算</span></div><div class="card"><small>本餐估算</small><div class="number"><span id="estimate">${Math.round(520*factor)}</span> <span class="unit">kcal</span></div><p class="sub" style="margin:10px 0">照片难以判断用油和份量，请按实际食用情况校正。</p><div class="segments" aria-label="食用份量">${[.5,1,1.5,2].map(n=>`<button data-factor="${n}" class="${factor===n?'selected':''}">${n} 份</button>`).join('')}</div>${[['香煎鸡肉',120,220],['熟米饭',150,195],['蔬菜与用油',100,105]].map(x=>`<div class="row editrow"><div><b>${x[0]}</b><div class="sub">估计 ${Math.round(x[1]*factor)} g</div></div><span>${Math.round(x[2]*factor)} kcal</span></div>`).join('')}</div><button id="saveMeal" class="primary wide" ${saved?'disabled':''}>${saved?'此演示餐次已保存':'确认并记入午餐'}</button><button class="outline wide" data-go="assistant">返回聊天</button>`,
trends:()=>longTrends(),
assistant:()=>header('吃了么','日常饮食搭子 · 演示')+`<button class="day-peek" data-go="today"><div><small>今天已记录</small><div><b>${total().toLocaleString()}</b> <span>kcal</span></div></div><div class="peek-right"><span>${saved?'3':'2'} 餐记录 ↗</span><small>目标 1,900 kcal</small></div></button><div class="greeting"><h2>今天吃了么？</h2><p>好好吃饭，慢慢记录。</p></div><div class="suggestions"><button data-prompt="看看今天吃得怎么样">看看今天吃得怎么样 ↗</button><button data-prompt="我不吃香菜">我不吃香菜</button></div><div class="conversation" aria-live="polite">${messages.map(m=>`<div class="chat ${m.role==='user'?'user':''}"><span class="message-label">${m.role==='user'?'你':'吃了么 · 演示回复'}</span><p>${escapeHtml(m.text)}</p></div>`).join('')}${saved?`<div class="card receipt"><span class="label">本地记录已更新</span><h3>这一餐，记好了</h3><p>${Math.round(520*savedFactor)} kcal · 午餐</p><button data-go="today">查看今天的记录 ↗</button></div>`:''}</div>`,
settings:()=>header('设置','我的吃了么')+`<button class="setting-link" data-edit-profile="true"><span>身体数据<small>${profile?`${profile.age} 岁 · ${profile.height} cm · ${profile.weight} kg`:'尚未填写'}</small></span><span>编辑 ↗</span></button><button class="setting-link" data-go="data">数据记录 <span>${measurements.length} 条身体记录 ↗</span></button><div class="card resting-preview"><small>静息消耗 · 估算</small><div><strong>${restingLabel()}</strong> <span>kcal / 天</span></div></div><button class="setting-link" data-go="setupAI"><span>模型与 API Key<small>${keyFilled?'已演示填写 · 未连接':'尚未填写'}</small></span><span>配置 ↗</span></button><div class="card"><h3>本地记忆</h3><button id="toggleMemory" class="outline wide" aria-pressed="${memoryEnabled}" style="margin-top:12px">自动记忆：${memoryEnabled?'开启':'关闭'}</button><details><summary>查看与管理记忆（${memories.size}）</summary>${[...memories].map(([key,m])=>`<div class="memory-row"><p>${escapeHtml(m.text)}</p><small>来源：${escapeHtml(m.source)} · 本地自动更新</small><button data-forget="${key}" aria-label="忘记${escapeHtml(m.text)}">忘记这条</button></div>`).join('')||'<p class="sub">还没有记忆。可以在聊天中试试「我不吃香菜」。</p>'}</details></div><button class="setting-link" data-help="true">帮助与说明 <span>?</span></button>`
};
function show(name,refresh=false){screen.dataset.revising=String(refresh);screen.dataset.page=name;current=name;screen.innerHTML=pages[name]();if(!refresh){screen.scrollTop=0;window.scrollTo?.({top:0,behavior:"instant"})}nav.innerHTML=onboarding?'':[['assistant','chat','聊天'],['today','home','记录'],['trends','trend','趋势']].map(([p,i,t])=>`<button data-go="${p}" class="${p===current?'active':''}" ${p===current?'aria-current="page"':''}>${icon(i)}<span class="sr-only">${t}</span></button>`).join('');document.getElementById('composer').innerHTML=name==='assistant'?`<form id="chatForm" class="composer"><label for="chatInput" class="sr-only">告诉吃了么你吃了什么</label><textarea id="chatInput" rows="2" maxlength="1000" placeholder="吃了什么？\n也可以拍照告诉我。" aria-label="告诉吃了么你吃了什么"></textarea><div class="composer-actions"><button type="button" data-go="capture" class="camera-button" aria-label="拍照记餐" title="拍照记餐">${icon('camera')}</button><button type="submit" class="send-button" aria-label="发送消息" title="发送消息" disabled>${icon('send')}</button></div></form>`:'';document.querySelectorAll('.guide [data-go]').forEach(b=>b.setAttribute('aria-current',String(b.dataset.go===name)));}
function toast(message){const t=document.getElementById('toast');t.textContent=message;t.classList.remove('hide');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>t.classList.add('hide'),3500)}
function sendMessage(text){text=text.trim().slice(0,1000);if(!text)return;messages.push({role:'user',text});let reply='收到。这是交互演示；连接你的模型后，我才能结合你选择的记录回答。你也可以直接拍照记餐。';if(text==='我不吃香菜'||text==='我现在吃香菜'){if(memoryEnabled)memories.set('coriander',{text:text==='我不吃香菜'?'不吃香菜':'现在接受香菜',source:'用户明确表达的偏好'});reply=memoryEnabled?'好，已更新你的本地饮食偏好。之后可在设置中纠正或忘记。':'好，本轮会参考这个偏好。自动记忆已关闭，不会长期记录。';}else if(text==='看看今天吃得怎么样'){reply=`今天已记录 ${total()} kcal。可以先核对实际份量、用油和酱汁。连接模型后，再一起查看更具体的饮食分析。`;}messages.push({role:'assistant',text:reply});show('assistant',true);screen.scrollTop=screen.scrollHeight;}
document.addEventListener('submit',e=>{if(e.target.id==='profileForm'){e.preventDefault();const p={sex:document.getElementById('sex').value,age:Number(document.getElementById('age').value),height:Number(document.getElementById('height').value),weight:Number(document.getElementById('weight').value)};if(!validProfile(p)){document.getElementById('profileError').textContent='请检查性别、年龄、身高与体重。';return}profile=p;profileDraft={...p};measurements.push({...p,date:new Date().toLocaleDateString('zh-CN')});show(onboarding?'setupAI':'settings');return}if(e.target.id==='modelForm'){e.preventDefault();keyFilled=!!document.getElementById('setupKey').value.trim();document.getElementById('setupKey').value='';const wasOnboarding=onboarding;onboarding=false;show(wasOnboarding?'assistant':'settings');return}if(e.target.id==='chatForm'){e.preventDefault();sendMessage(document.getElementById('chatInput').value)}});
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.monthStep){monthOffset=Math.min(0,Math.max(-120,monthOffset+Number(b.dataset.monthStep)));selectedDate=monthOffset===0?'2026-09-24':isoDate(new Date(Date.UTC(2026,8+monthOffset,1)));show('trends',true);return}if(b.dataset.weekStep){weekOffset=Math.min(0,Math.max(-520,weekOffset+Number(b.dataset.weekStep)));show('trends',true);return}if(b.dataset.day){selectedDate=b.dataset.day;show('trends',true);return}if(b.dataset.period){trendPeriod=b.dataset.period;trendSelection=null;show('trends');return}if(b.dataset.bucket){trendSelection=Number(b.dataset.bucket);const offset=screen.scrollTop;const chartOffset=document.querySelector?.('.chart-scroll')?.scrollLeft??0;show('trends',true);screen.scrollTop=offset;const chart=document.querySelector?.('.chart-scroll');if(chart)chart.scrollLeft=chartOffset;return}if(b.dataset.help){if(current==='help')return;helpReturn=current;show('help');return}if(b.id==='backHelp'){show(helpReturn);return}if(b.dataset.editProfile){profileDraft=profile?{...profile}:{sex:'',age:'',height:'',weight:''};show('profile');return}if(b.id==='skipKey'){const wasOnboarding=onboarding;onboarding=false;show(wasOnboarding?'assistant':'settings');return}if(b.dataset.go){if(b.dataset.go==='welcome')onboarding=true;else if(!['setupAI','help','profile'].includes(b.dataset.go))onboarding=false;show(b.dataset.go);}if(b.dataset.prompt)sendMessage(b.dataset.prompt);if(b.dataset.factor){factor=Number(b.dataset.factor);show('capture',true)}if(b.id==='saveMeal'&&!saved){saved=true;savedFactor=factor;if(memoryEnabled)memories.set('meal',{text:`最近确认的午餐：${Math.round(520*savedFactor)} kcal`,source:'已确认餐次'});show('assistant');toast(memoryEnabled?'餐次已记录，本地摘要已更新':'餐次已记录；自动记忆已关闭')}if(b.id==='theme')document.getElementById('phone').classList.toggle('dark');if(b.id==='testInfo')toast('正式版分别测试文字和图片；此页面不会联网');if(b.id==='toggleMemory'){memoryEnabled=!memoryEnabled;show('settings',true)}if(b.dataset.forget){memories.delete(b.dataset.forget);show('settings',true);toast('这条记忆已忘记')}});
document.addEventListener('input',e=>{if(e.target.id==='chatInput'){e.target.style.height='auto';e.target.style.height=Math.min(e.target.scrollHeight,144)+'px';document.querySelector('.send-button').disabled=!e.target.value.trim();return}if(['sex','age','height','weight'].includes(e.target.id)){profileDraft[e.target.id]=e.target.value;const p={sex:profileDraft.sex,age:Number(profileDraft.age),height:Number(profileDraft.height),weight:Number(profileDraft.weight)};const value=validProfile(p)?resting(p):null;document.getElementById('restingValue').textContent=value===null?'—':value.toLocaleString()}});
let swipeStart=null;
document.addEventListener('pointerdown',e=>{if(e.target.closest('.month-grid'))swipeStart={x:e.clientX,y:e.clientY}});
document.addEventListener('pointercancel',()=>{swipeStart=null});
document.addEventListener('pointerup',e=>{if(!swipeStart)return;const dx=e.clientX-swipeStart.x,dy=e.clientY-swipeStart.y;swipeStart=null;if(Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy)*1.4){monthOffset=Math.min(0,Math.max(-120,monthOffset+(dx<0?1:-1)));selectedDate=monthOffset===0?'2026-09-24':isoDate(new Date(Date.UTC(2026,8+monthOffset,1)));show('trends',true)}});
show('welcome');
</script></body></html>
